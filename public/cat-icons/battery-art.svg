<svg xmlns="http://www.w3.org/2000/svg" viewBox="90 78 620 663">
  <defs>
    <linearGradient id="g3body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93d66a"/>
      <stop offset="1" stop-color="#64b23e"/>
    </linearGradient>
    <linearGradient id="g3lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a5e07c"/>
      <stop offset="1" stop-color="#7cc655"/>
    </linearGradient>
    <linearGradient id="g3panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46464c"/>
      <stop offset="1" stop-color="#2e2e33"/>
    </linearGradient>
    <linearGradient id="g3red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f26a5e"/>
      <stop offset="1" stop-color="#d23f34"/>
    </linearGradient>
    <linearGradient id="g3blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b8cf0"/>
      <stop offset="1" stop-color="#2f5fc4"/>
    </linearGradient>
    <linearGradient id="g3bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6cf5a"/>
      <stop offset="1" stop-color="#e8b433"/>
    </linearGradient>
  </defs>

  <!-- handle -->
  <path d="M320 240 L320 150 Q320 108 362 108 L438 108 Q480 108 480 150 L480 240"
        fill="none" stroke="#2b2b30" stroke-width="46" stroke-linecap="round"/>
  <path d="M330 236 L330 152 Q330 120 360 120"
        fill="none" stroke="#4a4a52" stroke-width="12" stroke-linecap="round" opacity="0.8"/>

  <!-- terminal posts -->
  <rect x="176" y="120" width="64" height="80" rx="14" fill="url(#g3red)"/>
  <rect x="176" y="120" width="64" height="18" rx="9" fill="#f59a91"/>
  <rect x="560" y="120" width="64" height="80" rx="14" fill="url(#g3blue)"/>
  <rect x="560" y="120" width="64" height="18" rx="9" fill="#8fb2f6"/>
  <!-- terminal bases -->
  <rect x="140" y="176" width="136" height="58" rx="18" fill="#2b2b30"/>
  <rect x="524" y="176" width="136" height="58" rx="18" fill="#2b2b30"/>

  <!-- lid -->
  <rect x="96" y="222" width="608" height="96" rx="30" fill="url(#g3lid)"/>
  <rect x="118" y="238" width="140" height="18" rx="9" fill="#ffffff" opacity="0.45"/>

  <!-- body -->
  <rect x="122" y="300" width="556" height="400" rx="34" fill="url(#g3body)"/>
  <!-- base flare -->
  <rect x="100" y="672" width="600" height="64" rx="24" fill="url(#g3lid)"/>
  <rect x="122" y="690" width="556" height="30" rx="15" fill="#559a33" opacity="0.5"/>

  <!-- dark face panel -->
  <rect x="176" y="344" width="448" height="312" rx="30" fill="url(#g3panel)"/>
  <rect x="196" y="358" width="408" height="12" rx="6" fill="#5a5a62" opacity="0.6"/>

  <!-- minus -->
  <rect x="222" y="482" width="98" height="34" rx="17" fill="#ffffff"/>
  <!-- bolt (centred on the panel) -->
  <path d="M436 380 L368 528 L424 528 L392 622 L500 462 L440 462 L482 380 Z" fill="url(#g3bolt)" transform="translate(-32 0)"/>
  <!-- plus -->
  <rect x="486" y="482" width="98" height="34" rx="17" fill="#ffffff"/>
  <rect x="518" y="450" width="34" height="98" rx="17" fill="#ffffff"/>

  <!-- body gloss -->
  <rect x="140" y="330" width="26" height="330" rx="13" fill="#ffffff" opacity="0.25"/>
</svg>
