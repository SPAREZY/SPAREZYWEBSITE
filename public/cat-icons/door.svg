<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cfe4f2"/>
      <stop offset="1" stop-color="#9cc2de"/>
    </linearGradient>
    <linearGradient id="paint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e23434"/>
      <stop offset="0.6" stop-color="#d42222"/>
      <stop offset="1" stop-color="#b81b1b"/>
    </linearGradient>
  </defs>

  <!-- door body -->
  <path d="M118 706
           C96 640 84 520 96 420
           C104 352 122 300 150 268
           L428 96
           C446 85 462 80 484 80
           L676 80
           C696 80 706 92 706 110
           L706 660
           C706 690 692 706 664 706
           Z"
        fill="url(#paint)"/>

  <!-- window frame (dark) -->
  <path d="M172 300 L446 128 C458 121 468 118 482 118 L648 118 C662 118 668 126 668 138 L668 300 Z"
        fill="#242b34"/>
  <!-- glass -->
  <path d="M196 288 L452 146 C460 142 468 140 480 140 L636 140 C646 140 650 146 650 154 L650 288 Z"
        fill="url(#glass)"/>
  <!-- glass reflection -->
  <path d="M300 288 L560 140 L620 140 L360 288 Z" fill="#ffffff" opacity="0.35"/>

  <!-- side mirror -->
  <g>
    <path d="M232 262 C232 240 250 228 274 228 C310 228 330 244 330 264 C330 282 312 290 286 290 L232 290 Z" fill="#20262e"/>
    <path d="M250 246 C260 238 276 236 288 240 C300 244 308 252 306 260 C294 266 268 264 250 246 Z" fill="#3a434f" opacity="0.9"/>
    <rect x="222" y="268" width="24" height="22" rx="6" fill="#20262e"/>
  </g>

  <!-- door handle -->
  <rect x="556" y="344" width="96" height="26" rx="12" fill="#20262e"/>
  <rect x="548" y="350" width="18" height="14" rx="6" fill="#161b21"/>

  <!-- body creases -->
  <path d="M100 520 C300 512 520 512 704 516 L704 542 C520 538 300 538 102 546 Z" fill="#b81b1b" opacity="0.75"/>
  <path d="M104 600 C310 592 520 592 704 596 L704 618 C520 614 310 614 106 622 Z" fill="#a01414" opacity="0.7"/>

  <!-- front-edge highlight -->
  <path d="M150 268 C124 300 106 352 98 420 C90 500 96 600 112 680 L132 680 C118 600 112 500 120 424 C128 360 144 310 168 280 Z"
        fill="#ffffff" opacity="0.18"/>
</svg>
